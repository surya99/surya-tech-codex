<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">How an AI model processes a request</title><desc id="desc">A request moves from input through an AI model to an output, with a policy summarization example.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071524"/><stop offset="1" stop-color="#0d2d49"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="8"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#62dfff"/></marker></defs>
  <rect width="1200" height="620" rx="30" fill="url(#bg)"/><circle cx="600" cy="310" r="210" fill="#087df2" opacity=".08" filter="url(#g)"/>
  <text x="70" y="80" fill="#61dcff" font-family="monospace" font-size="18" letter-spacing="3">AI-103 FOUNDATION / MODEL FLOW</text>
  <g font-family="Arial,sans-serif"><rect x="70" y="205" width="270" height="190" rx="18" fill="#102c47" stroke="#315a78"/><text x="100" y="250" fill="#6cdbff" font-size="16">INPUT</text><text x="100" y="298" fill="#fff" font-size="23">“Summarize this</text><text x="100" y="330" fill="#fff" font-size="23">policy document”</text><text x="100" y="365" fill="#91a9bd" font-size="15">User request + context</text>
  <path d="M350 300H450" stroke="#62dfff" stroke-width="4" marker-end="url(#a)"/><rect x="465" y="175" width="270" height="250" rx="28" fill="#0d4160" stroke="#65e5ff" stroke-width="2"/><text x="600" y="255" fill="#7fe8ff" text-anchor="middle" font-size="18">AI MODEL</text><text x="600" y="315" fill="#fff" text-anchor="middle" font-size="31" font-weight="700">Understand</text><text x="600" y="350" fill="#fff" text-anchor="middle" font-size="31" font-weight="700">and generate</text><text x="600" y="390" fill="#5be1b7" text-anchor="middle" font-size="15">selected for the workload</text>
  <path d="M750 300H850" stroke="#62dfff" stroke-width="4" marker-end="url(#a)"/><rect x="865" y="205" width="270" height="190" rx="18" fill="#102c47" stroke="#315a78"/><text x="895" y="250" fill="#6cdbff" font-size="16">OUTPUT</text><text x="895" y="298" fill="#fff" font-size="23">Generated</text><text x="895" y="330" fill="#fff" font-size="23">summary</text><text x="895" y="365" fill="#91a9bd" font-size="15">Response for the user</text></g>
  <text x="600" y="545" fill="#95acc0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">The model is the processing capability—not the complete AI application.</text>
</svg>
