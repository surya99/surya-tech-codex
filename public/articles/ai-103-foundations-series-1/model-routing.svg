<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Cost-aware AI model routing architecture</title><desc id="desc">A request router sends simple requests to a smaller model and complex requests to a capable reasoning model.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071524"/><stop offset="1" stop-color="#102e4a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#61ddff"/></marker></defs><rect width="1200" height="680" rx="30" fill="url(#b)"/><text x="70" y="75" fill="#61ddff" font-family="monospace" font-size="18" letter-spacing="3">ENTERPRISE PATTERN / MODEL ROUTING</text><g font-family="Arial,sans-serif"><rect x="430" y="115" width="340" height="100" rx="18" fill="#102c47" stroke="#325d7d"/><text x="600" y="160" fill="#fff" text-anchor="middle" font-size="26" font-weight="700">User request</text><text x="600" y="190" fill="#91a9bd" text-anchor="middle" font-size="16">500,000 requests per day</text><path d="M600 215V275" stroke="#61ddff" stroke-width="4" marker-end="url(#a)"/><rect x="420" y="290" width="360" height="110" rx="22" fill="#0c4161" stroke="#61ddff" stroke-width="2"/><text x="600" y="338" fill="#fff" text-anchor="middle" font-size="27" font-weight="700">Request router</text><text x="600" y="370" fill="#69e1bc" text-anchor="middle" font-size="16">classify complexity and policy</text><path d="M480 400C480 465 275 440 275 500" fill="none" stroke="#61ddff" stroke-width="4" marker-end="url(#a)"/><path d="M720 400C720 465 925 440 925 500" fill="none" stroke="#61ddff" stroke-width="4" marker-end="url(#a)"/><rect x="100" y="510" width="350" height="120" rx="20" fill="#10364b" stroke="#4edaae"/><text x="275" y="555" fill="#5ce0b7" text-anchor="middle" font-size="16">SIMPLE / HIGH VOLUME</text><text x="275" y="593" fill="#fff" text-anchor="middle" font-size="27" font-weight="700">Small model</text><rect x="750" y="510" width="350" height="120" rx="20" fill="#142f59" stroke="#76a9ff"/><text x="925" y="555" fill="#8db8ff" text-anchor="middle" font-size="16">COMPLEX / 10,000 REQUESTS</text><text x="925" y="593" fill="#fff" text-anchor="middle" font-size="27" font-weight="700">Capable model</text></g></svg>
