<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Model, deployment, and endpoint relationship</title><desc id="desc">A .NET application calls an endpoint, which exposes a configured deployment of an AI model.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071524"/><stop offset="1" stop-color="#0d304c"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#64dfff"/></marker></defs><rect width="1200" height="600" rx="30" fill="url(#b)"/><text x="70" y="75" fill="#61ddff" font-family="monospace" font-size="18" letter-spacing="3">RUNTIME PATH / MODEL TO APPLICATION</text><g font-family="Arial,sans-serif"><rect x="65" y="220" width="235" height="145" rx="20" fill="#102c47" stroke="#35617e"/><text x="182" y="275" fill="#79e6ff" text-anchor="middle" font-size="15">APPLICATION</text><text x="182" y="320" fill="#fff" text-anchor="middle" font-size="28" font-weight="700">.NET API</text><path d="M315 292H405" stroke="#64dfff" stroke-width="4" marker-end="url(#a)"/><rect x="420" y="220" width="235" height="145" rx="20" fill="#0d405f" stroke="#64dfff"/><text x="537" y="275" fill="#79e6ff" text-anchor="middle" font-size="15">NETWORK ACCESS</text><text x="537" y="320" fill="#fff" text-anchor="middle" font-size="28" font-weight="700">Endpoint</text><path d="M670 292H760" stroke="#64dfff" stroke-width="4" marker-end="url(#a)"/><rect x="775" y="175" width="360" height="235" rx="24" fill="#102b45" stroke="#40698a"/><text x="955" y="225" fill="#7fe8ff" text-anchor="middle" font-size="15">DEPLOYMENT</text><text x="955" y="270" fill="#fff" text-anchor="middle" font-size="27" font-weight="700">customer-chat-prod</text><rect x="845" y="310" width="220" height="65" rx="14" fill="#153d55" stroke="#55dcb3"/><text x="955" y="350" fill="#fff" text-anchor="middle" font-size="22">Selected model</text></g><text x="600" y="505" fill="#94adbf" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">Business logic calls a stable endpoint instead of coupling directly to a model name.</text></svg>
