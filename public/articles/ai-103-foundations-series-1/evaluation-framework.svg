<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">AI response evaluation framework</title><desc id="desc">An AI response is evaluated for relevance, groundedness, completeness, and coherence before a production decision balances safety, latency, cost, and scale.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071524"/><stop offset="1" stop-color="#102f4b"/></linearGradient></defs><rect width="1200" height="650" rx="30" fill="url(#b)"/><text x="70" y="75" fill="#61ddff" font-family="monospace" font-size="18" letter-spacing="3">EVALUATION / PRODUCTION READINESS</text><g font-family="Arial,sans-serif"><text x="600" y="140" fill="#fff" text-anchor="middle" font-size="30" font-weight="700">Is the response good enough for the business?</text><g font-size="16"><rect x="65" y="205" width="250" height="150" rx="20" fill="#102f4b" stroke="#4b85ad"/><text x="190" y="252" fill="#6ee3ff" text-anchor="middle">RELEVANCE</text><text x="190" y="295" fill="#fff" text-anchor="middle" font-size="21">Answers the</text><text x="190" y="323" fill="#fff" text-anchor="middle" font-size="21">actual question</text><rect x="338" y="205" width="250" height="150" rx="20" fill="#103948" stroke="#55dcb3"/><text x="463" y="252" fill="#63e2bb" text-anchor="middle">GROUNDEDNESS</text><text x="463" y="295" fill="#fff" text-anchor="middle" font-size="21">Supported by</text><text x="463" y="323" fill="#fff" text-anchor="middle" font-size="21">source context</text><rect x="612" y="205" width="250" height="150" rx="20" fill="#102f4b" stroke="#4b85ad"/><text x="737" y="252" fill="#6ee3ff" text-anchor="middle">COMPLETENESS</text><text x="737" y="295" fill="#fff" text-anchor="middle" font-size="21">Includes every</text><text x="737" y="323" fill="#fff" text-anchor="middle" font-size="21">important condition</text><rect x="885" y="205" width="250" height="150" rx="20" fill="#102f4b" stroke="#4b85ad"/><text x="1010" y="252" fill="#6ee3ff" text-anchor="middle">COHERENCE</text><text x="1010" y="295" fill="#fff" text-anchor="middle" font-size="21">Logical and</text><text x="1010" y="323" fill="#fff" text-anchor="middle" font-size="21">consistent</text></g><rect x="165" y="430" width="870" height="115" rx="23" fill="#0c405f" stroke="#62dfff"/><text x="600" y="472" fill="#fff" text-anchor="middle" font-size="25" font-weight="700">Production decision</text><text x="600" y="514" fill="#9be2f2" text-anchor="middle" font-size="18">Quality + Safety + Latency + Cost + Scalability</text></g></svg>
